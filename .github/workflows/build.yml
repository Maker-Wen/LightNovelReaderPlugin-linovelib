name: Build and release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true
        default: 'v2.0.0-simplified'
      publish:
        description: 'Publish/update the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :plugin:testDebugUnitTest :plugin:assembleRelease

      - name: Prepare release asset
        id: asset
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%-simplified}"
          SRC=$(find plugin/build/outputs/apk/release -name '*.apk.lnrp' ! -name '*unsigned*' | head -1)
          if [ -z "$SRC" ]; then
            echo "signed release apk not found" >&2
            exit 1
          fi
          OUT="Linovelib-Simplified-Standalone-${BASE_VERSION}.apk.lnrp"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.out }}
          path: ${{ steps.asset.outputs.out }}

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.asset.outputs.tag }}"
          OUT="${{ steps.asset.outputs.out }}"
          SHA="${{ steps.asset.outputs.sha }}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%-simplified}"
          cat > release-notes.md <<'EOF'
          ## Linovelib 简体

          基于 [j955229/LightNovelReaderPlugin-linovelib](https://github.com/j955229/LightNovelReaderPlugin-linovelib) 的独立简体版。

          - 插件名：`Linovelib 简体`
          - applicationId：`io.nightfish.lightnovelreader.plugin.linovelib_simplified`
          - 逻辑数据源 id：`linovelib_simplified`（API 4 保留旧 hash 标识用于迁移）
          - 文字转换：`toTraditional` -> `toSimplified`
          - 可以和原版 `Linovelib TW` 同时安装
          - release 签名构建
          - Android 10+ 支持 ICU 繁简转换
          EOF
          printf '\nSHA-256: `%s`\n' "$SHA" >> release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Linovelib 简体 $BASE_VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" "$OUT" --repo "$GITHUB_REPOSITORY" --title "Linovelib 简体 $BASE_VERSION" --notes-file release-notes.md
          fi
