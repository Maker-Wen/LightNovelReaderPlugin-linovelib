name: Build and release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true
        default: 'v2.2.1'
      publish:
        description: 'Publish/update the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Verify release tag
        id: release
        run: |
          TAG_REF="refs/tags/$RELEASE_TAG"
          git check-ref-format "$TAG_REF"
          git show-ref --verify --quiet "$TAG_REF"
          TAG_COMMIT=$(git rev-parse --verify "$TAG_REF^{commit}")
          [ "$TAG_COMMIT" = "$(git rev-parse HEAD)" ] || { echo "tag does not match checked-out commit: $RELEASE_TAG" >&2; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          GRADLE_VERSION=$(awk -F'"' '/versionName = / { print $2; exit }' plugin/build.gradle.kts)
          [ "$VERSION" = "$GRADLE_VERSION" ] || { echo "tag $VERSION does not match versionName $GRADLE_VERSION" >&2; exit 1; }
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :plugin:testDebugUnitTest :plugin:assembleRelease :plugin:lintRelease

      - name: Prepare release asset
        id: asset
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          SRC=$(python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          directory = Path("plugin/build/outputs/apk/release")
          metadata = json.loads((directory / "output-metadata.json").read_text())
          if metadata["artifactType"]["type"] != "APK" or metadata["variantName"] != "release":
              raise SystemExit("unexpected release artifact metadata")
          elements = metadata["elements"]
          if len(elements) != 1:
              raise SystemExit("expected exactly one release APK")
          element = elements[0]
          if element["versionName"] != os.environ["RELEASE_TAG"].removeprefix("v"):
              raise SystemExit("release APK version does not match tag")
          filename = element["outputFile"]
          if Path(filename).name != filename or not filename.endswith(".apk.lnrp") or "-unsigned" in filename:
              raise SystemExit("expected a signed release APK filename")
          apk = directory / filename
          if not apk.is_file():
              raise SystemExit("release APK from metadata does not exist")
          print(apk)
          PYTHON
          )
          OUT="Linovelib-${VERSION}.apk.lnrp"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.out }}
          path: ${{ steps.asset.outputs.out }}

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_ASSET: ${{ steps.asset.outputs.out }}
          RELEASE_SHA: ${{ steps.asset.outputs.sha }}
        run: |
          TAG="$RELEASE_TAG"
          OUT="$RELEASE_ASSET"
          SHA="$RELEASE_SHA"
          TAG_REF="refs/tags/$TAG"
          REMOTE_COMMIT=$(git ls-remote --exit-code --tags origin "$TAG_REF" "$TAG_REF^{}" | awk '
            /\^\{\}$/ { peeled = $1; next }
            { direct = $1 }
            END { print peeled ? peeled : direct }
          ')
          [ "$REMOTE_COMMIT" = "$RELEASE_COMMIT" ] || { echo "remote tag no longer matches built commit: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          NOTES="docs/releases/${TAG}.md"
          [ -f "$NOTES" ] || { echo "release notes not found: $NOTES" >&2; exit 1; }
          cp "$NOTES" release-notes.md
          printf '\nSHA-256: `%s`\n' "$SHA" >> release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            [ "$IS_DRAFT" = "true" ] || { echo "refusing to replace assets of a published release: $TAG" >&2; exit 1; }
            gh release upload "$TAG" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Linovelib $VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" "$OUT" --repo "$GITHUB_REPOSITORY" --title "Linovelib $VERSION" --notes-file release-notes.md --draft --verify-tag
          fi
